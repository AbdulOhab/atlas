# /etc/nginx/sites-available/atlas-ce  (symlinked into sites-enabled)
server {
    listen 80;
    server_name atlas-ce.mycore.qzz.io;
    charset utf-8;

    location / {
        proxy_pass http://127.0.0.1:24030; # Atlas CE container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
